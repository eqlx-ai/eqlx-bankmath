name: Bug report
description: A number is wrong, a file is read wrongly, or something fails.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Do not attach real customer data.** Describe the case, or reproduce it with a few made-up numbers."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran (command or code, settings), what you expected and why, what you got.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Minimal input
      description: The tool call and its arguments that show the problem.
      render: text
  - type: input
    id: version
    attributes:
      label: Versions
      description: eqlx-bankmath and Python versions.
